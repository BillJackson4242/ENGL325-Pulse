<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENGL 325 · Discussion Pulse · Instructor</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0a0e14; --paper: #f4f1eb; --paper-dark: #e8e3d9;
  --accent: #c45d3e; --accent-glow: #e8734f;
  --teal: #2a7a6e; --teal-light: #3ba392;
  --slate: #5a6472; --slate-light: #8892a0;
  --gold: #c4a052; --danger: #b83a3a; --success: #3a8a5c;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--ink); color: var(--paper); line-height: 1.6; }

/* Top bar */
.top-bar {
  background: rgba(255,255,255,0.03);
  border-bottom: 1px solid rgba(255,255,255,0.08);
  padding: 16px 40px;
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 12px;
}
.top-bar-left { display: flex; align-items: baseline; gap: 16px; }
.top-bar h1 { font-family: 'DM Serif Display', serif; font-size: 1.5rem; font-weight: 400; }
.top-bar h1 span { color: var(--accent-glow); }
.instructor-badge {
  font-family: 'IBM Plex Mono', monospace; font-size: 10px;
  padding: 4px 12px; border-radius: 4px;
  background: var(--accent); color: white;
  letter-spacing: 1px; text-transform: uppercase;
}
.week-nav { display: flex; gap: 6px; flex-wrap: wrap; }
.week-btn {
  font-family: 'IBM Plex Mono', monospace; font-size: 11px;
  padding: 6px 14px; border: 1px solid rgba(255,255,255,0.12);
  background: transparent; color: var(--slate-light);
  border-radius: 4px; cursor: pointer; transition: all 0.2s;
}
.week-btn:hover:not(.disabled) { border-color: var(--accent); color: var(--paper); }
.week-btn.active { background: var(--accent); border-color: var(--accent); color: white; }
.week-btn.disabled { opacity: 0.2; pointer-events: none; }

.container { max-width: 1440px; margin: 0 auto; padding: 28px 40px 80px; }

/* Triage */
.triage-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 32px; }
.triage-card { border-radius: 10px; padding: 20px; border: 1px solid rgba(255,255,255,0.08); }
.triage-card.red { background: rgba(184,58,58,0.08); border-color: rgba(184,58,58,0.25); }
.triage-card.gold { background: rgba(196,160,82,0.08); border-color: rgba(196,160,82,0.25); }
.triage-card.green { background: rgba(58,138,92,0.08); border-color: rgba(58,138,92,0.25); }
.triage-header {
  font-family: 'IBM Plex Mono', monospace; font-size: 11px;
  letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 12px;
}
.triage-card.red .triage-header { color: #f87171; }
.triage-card.gold .triage-header { color: var(--gold); }
.triage-card.green .triage-header { color: #4ade80; }
.triage-item { padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 0.88rem; }
.triage-item:last-child { border-bottom: none; }
.triage-name { font-weight: 600; color: var(--paper); }
.triage-detail { color: var(--slate-light); font-size: 0.8rem; margin-top: 2px; }
.triage-tag {
  font-family: 'IBM Plex Mono', monospace; font-size: 9px;
  padding: 2px 8px; border-radius: 3px; margin-left: 8px; letter-spacing: 0.5px;
}
.triage-tag.ai { background: rgba(196,93,62,0.3); color: var(--accent-glow); }
.triage-tag.ghost { background: rgba(184,58,58,0.3); color: #f87171; }
.triage-tag.isolated { background: rgba(196,160,82,0.3); color: var(--gold); }
.triage-empty { color: #555; font-style: italic; font-size: 0.85rem; }

/* Section labels */
.section-label {
  font-family: 'DM Serif Display', serif; font-size: 1.3rem;
  margin: 32px 0 16px; padding-bottom: 8px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}

/* Filter bar */
.filter-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.filter-btn {
  font-family: 'IBM Plex Mono', monospace; font-size: 11px;
  padding: 6px 16px; border: 1px solid rgba(255,255,255,0.12);
  background: transparent; color: var(--slate-light);
  border-radius: 4px; cursor: pointer; transition: all 0.2s;
}
.filter-btn:hover { border-color: var(--accent); color: var(--paper); }
.filter-btn.active { background: rgba(255,255,255,0.08); color: var(--paper); border-color: rgba(255,255,255,0.2); }

/* Table */
.table-wrap { overflow-x: auto; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); }
table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
thead th {
  font-family: 'IBM Plex Mono', monospace; font-size: 0.68rem;
  letter-spacing: 0.5px; text-transform: uppercase; color: var(--slate-light);
  padding: 12px 10px; text-align: left;
  background: rgba(255,255,255,0.03); border-bottom: 1px solid rgba(255,255,255,0.1);
  cursor: pointer; white-space: nowrap; user-select: none;
}
thead th:hover { color: var(--accent-glow); }
tbody td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.03); white-space: nowrap; }
tbody tr:hover { background: rgba(255,255,255,0.03); }
.c-name { font-weight: 600; }
.c-group {
  font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem;
  padding: 3px 8px; border-radius: 4px; color: white; display: inline-block;
}
.c-role { color: var(--teal-light); font-size: 0.8rem; }
.c-n { font-family: 'IBM Plex Mono', monospace; text-align: center; }
.c-n.zero { color: #555; }
.c-n.warn { color: var(--danger); font-weight: 600; }
.c-n.good { color: var(--success); }
.c-bool { text-align: center; }
.c-bool.yes { color: var(--success); }
.c-bool.no { color: #444; }
.c-ai { text-align: center; }
.c-ai.flag { color: var(--accent-glow); font-weight: 700; }

/* Qualitative cards */
.qual-card {
  background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 8px; padding: 16px 20px; margin-bottom: 10px;
}
.qual-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; flex-wrap: wrap; gap: 8px; }
.qual-name { font-weight: 600; font-size: 0.95rem; }
.qual-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.qual-tag {
  font-family: 'IBM Plex Mono', monospace; font-size: 9px;
  padding: 3px 10px; border-radius: 4px; letter-spacing: 0.5px; text-transform: uppercase;
}
.qt-yes { background: rgba(58,138,92,0.2); color: #4ade80; }
.qt-partial { background: rgba(196,160,82,0.2); color: var(--gold); }
.qt-no { background: rgba(184,58,58,0.2); color: #f87171; }
.qt-high { background: rgba(42,122,110,0.2); color: var(--teal-light); }
.qt-mod { background: rgba(255,255,255,0.06); color: var(--slate-light); }
.qt-low { background: rgba(255,255,255,0.03); color: #666; }
.qt-flag { background: rgba(196,93,62,0.2); color: var(--accent-glow); }
.qual-notes { font-size: 0.85rem; color: var(--slate-light); line-height: 1.65; }
.qual-reason { font-size: 0.78rem; color: var(--accent-glow); margin-top: 4px; font-style: italic; }

.nothing { color: #555; font-style: italic; font-size: 0.85rem; padding: 12px 0; }

@media (max-width: 1000px) {
  .triage-row { grid-template-columns: 1fr; }
  .container { padding: 16px 20px 60px; }
  .top-bar { padding: 12px 20px; }
}
</style>
</head>
<body>

<div class="top-bar">
  <div class="top-bar-left">
    <h1>Discussion <span>Pulse</span></h1>
    <span class="instructor-badge">Instructor</span>
  </div>
  <nav class="week-nav" id="weekNav"></nav>
</div>

<div class="container">
  <div id="triageSection"></div>
  <div class="section-label">All Students</div>
  <div class="filter-bar" id="filterBar"></div>
  <div class="table-wrap"><table><thead id="tHead"></thead><tbody id="tBody"></tbody></table></div>
  <div class="section-label" id="qualLabel">Qualitative Assessment</div>
  <div id="qualSection"></div>
</div>

<script>
// ============================================
// CONFIG
// ============================================
const DATA_BASE = './data/';
const WEEKS = [
  { key: 'week2', label: 'Wk 2', folder: 'week2', available: false },
  { key: 'week3', label: 'Wk 3', folder: 'week3', available: false },
  { key: 'week4', label: 'Wk 4', folder: 'week4', available: true },
  { key: 'week5', label: 'Wk 5', folder: 'week5', available: false },
  { key: 'week6', label: 'Wk 6', folder: 'week6', available: false },
  { key: 'week7', label: 'Wk 7', folder: 'week7', available: false },
  { key: 'week8', label: 'Wk 8', folder: 'week8', available: false },
];
const GC = { 'Group A':'#6b7fd7','Group B':'#d77a4a','Group C':'#5aab8b','Group 1':'#6b7fd7','Group 2':'#d77a4a','Group 3':'#5aab8b','Group 4':'#c4a052' };

let students = [], qual = [];
let sortCol = 'GroupName', sortDir = 'asc', filterMode = 'all';

// ============================================
// CSV PARSER
// ============================================
function parseCSV(text) {
  const lines = []; let cur = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (c === '"') { if (inQ && text[i+1] === '"') { cur += '"'; i++; } else inQ = !inQ; }
    else if ((c === '\n' || c === '\r') && !inQ) { if (cur.trim()) lines.push(cur); cur = ''; if (c === '\r' && text[i+1] === '\n') i++; }
    else cur += c;
  }
  if (cur.trim()) lines.push(cur);
  if (lines.length < 2) return [];
  const split = r => { const cols=[]; let col='',q=false; for(let i=0;i<r.length;i++){const c=r[i];if(c==='"')q=!q;else if(c===','&&!q){cols.push(col.trim());col='';}else col+=c;} cols.push(col.trim()); return cols; };
  let h = lines[0]; if (h.charCodeAt(0)===0xFEFF) h=h.slice(1);
  const hdr = split(h);
  return lines.slice(1).map(l => { const v=split(l); const o={}; hdr.forEach((k,i)=>o[k]=v[i]||''); return o; });
}

async function fetchCSV(url) {
  try { const r = await fetch(url); if(!r.ok) throw 0; return parseCSV(await r.text()); }
  catch(e) { return null; }
}

function num(v) { return parseInt(v)||0; }

// ============================================
// LOAD WEEK
// ============================================
async function loadWeek(key) {
  const w = WEEKS.find(x => x.key === key);
  if (!w || !w.available) return;
  document.querySelectorAll('.week-btn').forEach(b => b.classList.toggle('active', b.dataset.week === key));
  const base = DATA_BASE + w.folder + '/';
  const [s, q] = await Promise.all([
    fetchCSV(base + 'discussion_student_summary.csv'),
    fetchCSV(base + 'qualitative_assessment.csv'),
  ]);
  students = s || [];
  qual = q || [];
  renderAll();
}

function renderAll() {
  renderTriage();
  renderFilters();
  renderTable();
  renderQual();
}

// ============================================
// TRIAGE
// ============================================
function renderTriage() {
  const ghosts = students.filter(s => num(s.TotalPosts)===0);
  const ai = students.filter(s => num(s.AIPatternScore)>=3 && num(s.TotalPosts)>0);
  const isolated = students.filter(s => num(s.TotalPosts)>0 && num(s.Replies)===0 && num(s.InboundReplies)===0 && num(s.AIPatternScore)<3);
  const minimal = students.filter(s => num(s.TotalPosts)===1 && num(s.AIPatternScore)<3);
  const high = students.filter(s => num(s.TotalPosts)>=5 && num(s.UniqueStudentsEngaged)>=3);

  const redItems = [
    ...ghosts.map(s => `<div class="triage-item"><span class="triage-name">${s.StudentName}</span><span class="triage-tag ghost">GHOST</span><div class="triage-detail">${s.GroupName} · Zero posts</div></div>`),
    ...ai.map(s => `<div class="triage-item"><span class="triage-name">${s.StudentName}</span><span class="triage-tag ai">AI:${s.AIPatternScore}</span><div class="triage-detail">${s.GroupName} · ${s.AssignedRole||'—'} · ${s.TotalPosts} posts</div></div>`),
    ...isolated.map(s => `<div class="triage-item"><span class="triage-name">${s.StudentName}</span><span class="triage-tag isolated">ISOLATED</span><div class="triage-detail">${s.GroupName} · ${s.AssignedRole||'—'} · Posted but no interaction</div></div>`),
  ];

  document.getElementById('triageSection').innerHTML = `<div class="triage-row">
    <div class="triage-card red">
      <div class="triage-header">🔴 Needs attention (${redItems.length})</div>
      ${redItems.length ? redItems.join('') : '<div class="triage-empty">None this week</div>'}
    </div>
    <div class="triage-card gold">
      <div class="triage-header">🟡 Watch (${minimal.length})</div>
      ${minimal.length ? minimal.map(s => `<div class="triage-item"><span class="triage-name">${s.StudentName}</span><div class="triage-detail">${s.GroupName} · ${s.AssignedRole||'—'} · 1 post, minimal</div></div>`).join('') : '<div class="triage-empty">None this week</div>'}
    </div>
    <div class="triage-card green">
      <div class="triage-header">🟢 Strong (${high.length})</div>
      ${high.length ? high.map(s => `<div class="triage-item"><span class="triage-name">${s.StudentName}</span><div class="triage-detail">${s.GroupName} · ${s.AssignedRole||'—'} · ${s.TotalPosts} posts · ${s.UniqueStudentsEngaged} engaged · Auth:${s.AuthenticityScore}</div></div>`).join('') : '<div class="triage-empty">None this week</div>'}
    </div>
  </div>`;
}

// ============================================
// FILTERS
// ============================================
function renderFilters() {
  const bar = document.getElementById('filterBar');
  const filters = [
    { key:'all', label:'All' },
    { key:'flagged', label:'🔴 Needs Attention' },
    { key:'watch', label:'🟡 Watch' },
    { key:'strong', label:'🟢 Strong' },
    { key:'ai', label:'⚠️ AI Flags' },
  ];
  bar.innerHTML = filters.map(f => `<button class="filter-btn ${filterMode===f.key?'active':''}" data-f="${f.key}">${f.label}</button>`).join('');
  bar.querySelectorAll('.filter-btn').forEach(b => b.addEventListener('click', () => { filterMode = b.dataset.f; renderFilters(); renderTable(); }));
}

// ============================================
// TABLE
// ============================================
function renderTable() {
  const cols = [
    {k:'StudentName',l:'Student'}, {k:'GroupName',l:'Group'}, {k:'AssignedRole',l:'Role'},
    {k:'TotalPosts',l:'Posts',n:1}, {k:'MainPosts',l:'Main',n:1}, {k:'Replies',l:'Replies',n:1},
    {k:'AvgWordsPerPost',l:'Avg Wds',n:1}, {k:'QuestionsAsked',l:"Q's",n:1},
    {k:'UniqueStudentsEngaged',l:'Engaged',n:1}, {k:'PostedEarly',l:'Early'},
    {k:'DaysActive',l:'Days',n:1}, {k:'RoleExplicitlyNamed',l:'Named'},
    {k:'RoleKeywordsUsed',l:'Kw',n:1}, {k:'AuthenticityScore',l:'Auth',n:1},
    {k:'AIPatternScore',l:'AI',n:1},
  ];

  document.getElementById('tHead').innerHTML = '<tr>' + cols.map(c =>
    `<th data-col="${c.k}">${c.l}${sortCol===c.k?(sortDir==='asc'?' ↑':' ↓'):''}</th>`
  ).join('') + '</tr>';

  document.querySelectorAll('#tHead th').forEach(th => th.addEventListener('click', () => {
    const c = th.dataset.col;
    if(sortCol===c) sortDir = sortDir==='asc'?'desc':'asc'; else { sortCol=c; sortDir='asc'; }
    renderTable();
  }));

  let rows = [...students];
  if (filterMode==='flagged') rows = rows.filter(s => num(s.TotalPosts)===0 || (num(s.TotalPosts)>0 && num(s.Replies)===0 && num(s.InboundReplies)===0));
  if (filterMode==='watch') rows = rows.filter(s => num(s.TotalPosts)===1 && num(s.AIPatternScore)<3);
  if (filterMode==='strong') rows = rows.filter(s => num(s.TotalPosts)>=5 && num(s.UniqueStudentsEngaged)>=3);
  if (filterMode==='ai') rows = rows.filter(s => num(s.AIPatternScore)>=2);

  const numCols = cols.filter(c=>c.n).map(c=>c.k);
  rows.sort((a,b) => {
    let av=a[sortCol], bv=b[sortCol];
    if(numCols.includes(sortCol)){av=parseFloat(av)||0;bv=parseFloat(bv)||0;}
    else{av=(av||'').toLowerCase();bv=(bv||'').toLowerCase();}
    return (av<bv?-1:av>bv?1:0) * (sortDir==='asc'?1:-1);
  });

  document.getElementById('tBody').innerHTML = rows.map(s => {
    const p=num(s.TotalPosts), ai=num(s.AIPatternScore), rep=num(s.Replies), auth=num(s.AuthenticityScore), eng=num(s.UniqueStudentsEngaged);
    const gc = GC[s.GroupName]||'#888';
    return `<tr>
      <td class="c-name">${s.StudentName}</td>
      <td><span class="c-group" style="background:${gc}">${s.GroupName}</span></td>
      <td class="c-role">${s.AssignedRole||'—'}</td>
      <td class="c-n ${p===0?'warn':p>=5?'good':''}">${p}</td>
      <td class="c-n">${s.MainPosts}</td>
      <td class="c-n ${rep===0&&p>0?'warn':''}">${s.Replies}</td>
      <td class="c-n">${s.AvgWordsPerPost?parseFloat(s.AvgWordsPerPost).toFixed(0):'—'}</td>
      <td class="c-n">${s.QuestionsAsked}</td>
      <td class="c-n ${eng>=3?'good':''}">${s.UniqueStudentsEngaged}</td>
      <td class="c-bool ${s.PostedEarly==='TRUE'?'yes':'no'}">${s.PostedEarly==='TRUE'?'✓':'✗'}</td>
      <td class="c-n">${s.DaysActive}</td>
      <td class="c-bool ${s.RoleExplicitlyNamed==='TRUE'?'yes':'no'}">${s.RoleExplicitlyNamed==='TRUE'?'✓':'✗'}</td>
      <td class="c-n">${s.RoleKeywordsUsed}</td>
      <td class="c-n ${auth>=5?'good':''}">${s.AuthenticityScore}</td>
      <td class="c-ai ${ai>=3?'flag':''}">${ai>0?ai:'—'}</td>
    </tr>`;
  }).join('');
}

// ============================================
// QUALITATIVE
// ============================================
function renderQual() {
  const container = document.getElementById('qualSection');
  const label = document.getElementById('qualLabel');

  if (!qual.length) {
    label.textContent = 'Qualitative Assessment';
    container.innerHTML = '<div class="nothing">No qualitative_assessment.csv found for this week. Run your Claude analysis and drop the CSV in the data folder.</div>';
    return;
  }

  label.textContent = `Qualitative Assessment (${qual.length} students)`;

  // Detect column names (handle both "Last, First" and other formats)
  const nameCol = qual[0].StudentName !== undefined ? 'StudentName' : Object.keys(qual[0])[0];
  const groupCol = qual[0].Group !== undefined ? 'Group' : (qual[0].GroupName || 'Group');

  container.innerHTML = qual.map(q => {
    const name = q.StudentName || q[nameCol] || '?';
    const group = q.Group || q.GroupName || '';
    const role = q.Role || q.AssignedRole || '';
    const fulfilled = (q.RoleFulfilled||'').toLowerCase();
    const risk = (q.RiskTaking||'').toLowerCase();
    const flag = q.Flag || '';
    const reason = q.FlagReason || '';
    const notes = q.FeedbackNotes || '';
    const substantive = (q.Substantive||'').toLowerCase();

    const fulfilledCls = fulfilled==='yes'?'qt-yes':fulfilled==='partial'?'qt-partial':'qt-no';
    const fulfilledLbl = fulfilled==='yes'?'Role: Yes':fulfilled==='partial'?'Role: Partial':'Role: No';
    const riskCls = risk==='high'?'qt-high':risk==='moderate'?'qt-mod':'qt-low';

    let tags = `<span class="qual-tag ${fulfilledCls}">${fulfilledLbl}</span>`;
    tags += `<span class="qual-tag ${riskCls}">Risk: ${q.RiskTaking||'—'}</span>`;
    if (flag && flag !== 'None') tags += `<span class="qual-tag qt-flag">${flag}</span>`;

    return `<div class="qual-card">
      <div class="qual-header">
        <span class="qual-name">${name} <span style="color:var(--slate-light);font-weight:400;font-size:0.82rem;">· ${group} · ${role}</span></span>
        <div class="qual-tags">${tags}</div>
      </div>
      <div class="qual-notes">${notes}</div>
      ${reason ? `<div class="qual-reason">Flag: ${reason}</div>` : ''}
    </div>`;
  }).join('');
}

// ============================================
// INIT
// ============================================
function init() {
  const nav = document.getElementById('weekNav');
  nav.innerHTML = WEEKS.map(w =>
    `<button class="week-btn ${w.available?'':'disabled'}" data-week="${w.key}">${w.label}</button>`
  ).join('');
  nav.querySelectorAll('.week-btn:not(.disabled)').forEach(b =>
    b.addEventListener('click', () => loadWeek(b.dataset.week))
  );
  const latest = [...WEEKS].reverse().find(w => w.available);
  if (latest) loadWeek(latest.key);
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
